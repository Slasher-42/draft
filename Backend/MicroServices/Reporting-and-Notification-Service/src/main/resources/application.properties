spring.application.name=Reporting-and-Notification-Service
server.port=8086

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/reporting_notification_db
spring.datasource.username=postgres
spring.datasource.password=Novemba@42
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=reporting-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Service URLs
services.user-management.url=http://localhost:8081
services.startup-application.url=http://localhost:8082

# Scheduler ? how often the interval checker fires (every 60 seconds)
scheduler.interval.ms=60000