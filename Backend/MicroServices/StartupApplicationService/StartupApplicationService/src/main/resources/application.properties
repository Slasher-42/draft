spring.application.name=StartupApplicationService
server.port=8082

# Database
spring.datasource.url=jdbc:postgresql://ep-mute-pine-al4dfni6-pooler.c-3.eu-central-1.aws.neon.tech/startup_application_db?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.query.plan_cache_max_size=2048
spring.jpa.properties.hibernate.query.plan_parameter_metadata_max_size=128

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

#Kafka
spring.kafka.bootstrap-servers=d8rpce20pa8fqqs9v0ug.any.eu-central-1.mpx.prd.cloud.redpanda.com:9092
spring.kafka.admin.auto-create=false
spring.kafka.properties.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=SCRAM-SHA-256
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="slasher" password="${KAFKA_PASSWORD}";
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=6000
spring.kafka.producer.properties.request.timeout.ms=3000
spring.kafka.listener.missing-topics-fatal=false

#Service URLs
services.user-management.url=${USER_MANAGEMENT_URL:https://usermanagement-microservice.onrender.com}
services.ai-assessment.url=${AI_ASSESSMENT_URL:https://aiassessmentengine-service.onrender.com}
services.matching.url=${MATCHING_SERVICE_URL:https://investor-matching-and-presentation.onrender.com}

#AWS
aws.s3.bucket-name=readiness42
aws.s3.region=eu-north-1
aws.access-key-id=${AWS_ACCESS_KEY_ID}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY}